services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: campaign_planner
      POSTGRES_USER: campaign_planner
      POSTGRES_PASSWORD: campaign_planner
    ports:
      - "5432:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U campaign_planner -d campaign_planner
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  database_data:
