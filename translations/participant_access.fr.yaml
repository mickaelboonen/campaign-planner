help:
    button: Aide
    dialog: Aide du calendrier
    close: Fermer l’aide

    calendar:
        eyebrow: Vos disponibilités
        title: Cliquez directement sur vos créneaux
        desktop: Cliquez sur l’un de vos créneaux pour modifier votre disponibilité. Seule votre propre ligne est modifiable.
        mobile: Appuyez sur l’un de vos créneaux pour modifier votre disponibilité.
        cycle: Chaque clic fait défiler les statuts — Disponible, Peut-être, Indisponible puis Non renseigné.

    shortcuts:
        eyebrow: Actions rapides
        title: Remplissez plusieurs créneaux
        description: Choisissez un statut puis appliquez-le en un clic à toute la semaine, à tous les après-midi ou à tous les soirs.

    autosave:
        eyebrow: Sauvegarde automatique
        title: Rien à enregistrer manuellement
        description: Vos modifications sont enregistrées automatiquement après un court instant. Un indicateur vous confirme lorsque la sauvegarde est terminée.

    previous: Précédent
    next: Suivant
    finish: Terminer

