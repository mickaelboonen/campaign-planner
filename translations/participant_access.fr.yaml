        no_participant_campaign: Aucun participant actif dans cette campagne.
        no_slot: Aucun créneau disponible pour cette semaine.

    editor:
        status: Statut à appliquer
        available: Disponible
        maybe: Peut-être
        unavailable: Indisponible
        clear: Effacer
        help: Aide
        shortcuts: Actions rapides
        all_week: Toute la semaine
        all_afternoons: Tous les après-midi
        all_evenings: Tous les soirs
